<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name='viewport' content='width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no' />
    <title>Leaflet Control Resizer Basic Demo</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <link rel="stylesheet" href="../L.Control.Resizer.css" crossorigin=""/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet-src.js" crossorigin=""></script>
    <script src="../L.Control.Resizer.js"></script>

    <style type="text/css">
        #map { width: 300px; height: 300px; max-width: 100%; max-height: 500px;}
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="out"></div>

    <script type="text/javascript">
        const center = [40, 0];
        const osm = new L.TileLayer(
            '//{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            {attribution: '© OpenStreetMap contributors'},
        );

        // The map
        const map = new L.Map('map', {
            layers: [osm],
            center: center,
            zoom: 5,
        });

        const e = new L.Control.Resizer({onlyOnHover: true}).addTo(map);
        const s = new L.Control.Resizer({direction: 's'}).addTo(map);
        L.control.resizer({direction: 'se', pan: true}).addTo(map);
        setTimeout(function() { e.fakeHover(1000); }, 1000);

        L.DomEvent.on(s, 'down dragstart predrag drag dragend', function(e) {
            // eslint-disable-next-line no-console
            console.log(e.type, e);
        });
    </script>
</body>
</html>
